<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page - QR code verification</title>
    
    <!-- Document Corner Icon (Favicon in browser tab) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='16' height='22' rx='1.5' fill='%23ffffff' stroke='%23b0b7c3' stroke-width='1.5'/%3E%3Crect x='6' y='6' width='3.5' height='18' fill='%234299e1'/%3E%3Crect x='11' y='11' width='17' height='17' rx='1.5' fill='%23ffffff' stroke='%238c95a6' stroke-width='1.5'/%3E%3Cline x1='14' y1='16' x2='24' y2='16' stroke='%23cbd5e1' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='14' y1='20' x2='22' y2='20' stroke='%23cbd5e1' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='14' y1='24' x2='19' y2='24' stroke='%23cbd5e1' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            color: #222222;
            background-color: #ffffff;
            font-size: 13px;
            padding: 30px 50px;
        }

        /* Top Header */
        .header-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
            margin-left: 10px;
            margin-bottom: 60px;
        }

        .logo-box {
            display: inline-block;
            height: 73px;
            width: 156px;
        }

        .logo-box img {
            width: 156px;
            height: 73px;
            object-fit: contain;
            display: block;
        }

        .header-title {
            margin-left: 110px;
            font-size: 27px;
            font-weight: 500;
            color: #333333;
            letter-spacing: -0.2px;
        }

        /* Main Content */
        .main-content {
            margin-left: 345px;
            margin-top: 20px;
            position: relative;
        }

        .status-container {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 22px;
            color: #111111;
        }

        .status-success {
            color: #008000;
            font-weight: 500;
        }

        /* Card with Watermark */
        .verification-card {
            position: relative;
            width: 480px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Watermark using your logo.png */
        .verification-card::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 95px;
            width: 185px;
            height: 95px;
            background-image: url('logo.png'); /* Uses your PNG */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.12; /* Watermark transparency */
            pointer-events: none;
            z-index: 0;
        }

        .info-table {
            position: relative;
            z-index: 1;
            border-collapse: collapse;
            width: 100%;
        }

        .info-table tr {
            height: 23px;
        }

        .info-table td.label-col {
            width: 185px;
            vertical-align: top;
            padding-right: 15px;
        }

        .info-table td.value-col {
            vertical-align: top;
            color: #111111;
        }

        .font-bold {
            font-weight: 600;
            font-size: 13px;
        }

        .font-small-bold {
            font-weight: 600;
            font-size: 11px;
            line-height: 1.25;
            color: #111111;
        }

        .font-small-italic {
            font-size: 11px;
            font-style: italic;
            font-weight: 600;
            color: #111111;
        }

        .font-italic-val {
            font-style: italic;
            font-size: 13px;
        }

        .spacer-row {
            height: 18px;
        }

        hr {
            border: 0;
            border-top: 1px solid #efefef;
            margin-top: 160px;
            margin-bottom: 25px;
        }

        footer {
            color: #222222;
            font-size: 13px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-container">
        <div class="logo-box">
            <!-- Your PNG Logo -->
            <img src="logo.png" id="Image1" alt="Logo" />
        </div>
        <div class="header-title">
            QR Code verification
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="status-container">
            Verification Status:<span id="MainContent_LblStatus" class="status-success">Verification success!!!</span>
        </div>

        <div class="verification-card">
            <table class="info-table">
                <!-- Account Number -->
                <tr>
                    <td class="label-col font-bold">
                        <span id="MainContent_LabelAccNo">Account No</span>
                    </td>
                    <td class="value-col">
                        <span id="MainContent_LblAccNo">0432112000124276</span>
                    </td>
                </tr>

                <!-- Account Name -->
                <tr>
                    <td class="label-col font-bold">
                        <span id="MainContent_LabelAccName">Account Name</span>
                    </td>
                    <td class="value-col">
                        <span id="MainContent_LblAccName"> RAHMAN FOOD AND BEVERAGE </span>
                    </td>
                </tr>

                <!-- Opening Balance -->
                <tr>
                    <td class="label-col font-small-bold">
                        <span id="MainContent_LblOpenBal1">Report Date Opening<br />Balance</span>
                    </td>
                    <td class="value-col">
                        <span id="MainContent_LblOpenBal">496,923.15</span>
                    </td>
                </tr>

                <!-- Closing Balance -->
                <tr>
                    <td class="label-col font-small-italic">
                        <span id="MainContent_LblCloseBal1">Report Date Closing Balance</span>
                    </td>
                    <td class="value-col">
                        <span id="MainContent_LblCloseBal">1,162,838.84</span>
                    </td>
                </tr>

                <!-- Spacer -->
                <tr class="spacer-row">
                    <td></td>
                    <td></td>
                </tr>

                <!-- Report Generation Date -->
                <tr>
                    <td class="label-col font-small-italic">
                        <span id="MainContent_Label110">Report Generation Date</span>
                    </td>
                    <td class="value-col">
                        <span id="MainContent_Label111" class="font-italic-val">12-Nov-2026</span>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Divider & Footer -->
    <hr />
    <footer>
        <p>&copy; 2026 - United Commercial Bank PLC</p>
    </footer>

</body>
</html>
